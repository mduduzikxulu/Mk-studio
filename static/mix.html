<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mix - Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Unbounded:wght@500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script></head><body>
<div id="top"></div><main class="studio">
<div class="tools"><button class="amb" id="add">Add audio</button><input type="file" id="file" accept="audio/*" multiple hidden>
<span class="grp"><button id="undo">Undo</button><button id="redo">Redo</button></span>
<span class="grp"><button id="split">Trim here</button><button id="dup">Duplicate</button><button id="voice">Mark as voice</button><button id="del">Delete</button></span>
<span class="grp"><button id="zo" aria-label="Zoom out">-</button><div id="zb" style="width:120px"></div><button id="zi" aria-label="Zoom in">+</button><button id="fit">Fit</button></span></div>
<div class="trans"><button class="amb" id="play">Play</button><button id="stop">Stop</button><span id="tc">00:00.0</span><div class="master"><span id="ml">Master 100%</span><div id="mb"></div></div></div>
<div id="wrap"><canvas id="cv"></canvas><div id="sp"></div></div>
<div class="opts"><div><h3>Selected clip</h3><span id="cn" style="color:var(--mu)">Click a clip to select it</span><div id="cvb" style="margin-top:10px"></div><small id="cvl">Clip volume 100%</small></div>
<div><h3>Background music level</h3><label><input type="checkbox" id="duck"> Follow the voice (music dips while a voice clip speaks)</label><div id="db"></div><small id="dl">Off: music plays at a steady level.</small></div>
<div><h3>Export</h3><div class="row" style="margin:0"><button class="amb" id="xw">Download WAV</button><button id="xm">Download MP3</button></div><small id="xs">WAV is best quality. MP3 is smaller.</small></div></div>
</main><div id="toast"></div><div id="clip-menu" class="clip-menu" role="menu" aria-label="Audio clip actions" hidden>
<button type="button" role="menuitem" data-action="split">Trim here</button>
<button type="button" role="menuitem" data-action="duplicate">Duplicate</button>
<button type="button" role="menuitem" data-action="voice">Mark as voice</button>
<button type="button" role="menuitem" data-action="delete">Delete</button>
</div><script src="/site.js"></script><script src="/mix.js"></script></body></html>
