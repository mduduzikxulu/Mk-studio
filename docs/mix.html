<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mix - Studio</title>

  <!-- Used by site.js to build correct links on GitHub Pages (served under /Mk-studio/) -->
  <meta name="base-path" content="/Mk-studio">

  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <!-- MP3 encoder — only needed for the "Download MP3" export button -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
</head>
<body>

<!-- site.js replaces this div with the real nav header -->
<div id="top"></div>

<main class="studio">

  <!-- ── Toolbar ─────────────────────────────────────────────── -->
  <div class="tools">
    <button class="amb" id="add">Add audio</button>
    <!-- Hidden file picker — triggered by the "Add audio" button -->
    <input type="file" id="file" accept="audio/*" multiple hidden>

    <span class="grp">
      <button id="undo">Undo</button>
      <button id="redo">Redo</button>
    </span>

    <span class="grp">
      <button id="split">Trim here</button>
      <button id="dup">Duplicate</button>
      <button id="voice">Mark as voice</button>
      <button id="del">Delete</button>
    </span>

    <span class="grp">
      <button id="allvol">All volume</button>
      <button id="zo" aria-label="Zoom out">-</button>
      <!-- Zoom bar — rendered by Bars() in mix.js -->
      <div id="zb" style="width:120px"></div>
      <button id="zi" aria-label="Zoom in">+</button>
      <button id="fit">Fit</button>
    </span>
  </div>

  <!-- ── Transport ───────────────────────────────────────────── -->
  <div class="trans">
    <button class="amb" id="play">Play</button>
    <button id="stop">Stop</button>
    <span id="tc">00:00.0</span>
    <!-- Time-unit selector: click to cycle through s / ms / μs / ns / … -->
    <button id="unit-btn" title="Click to change time unit" style="font-size:11px;padding:5px 9px;min-width:38px">s</button>
  </div>

  <!-- ── Timeline + sidebar ───────────────────────────────── -->
  <div class="studio-body">

    <!-- Left sidebar: track names, synced to canvas lanes -->
    <div class="studio-sidebar" id="sidebar">
      <div class="studio-sidebar-header">Tracks</div>
      <!-- .sidebar-track rows injected by JS -->
    </div>

    <!-- ── Timeline ── -->
    <!-- #wrap scrolls horizontally; #cv is the sticky canvas; #sp sets scroll width -->
    <div id="wrap">
      <canvas id="cv"></canvas>
      <div id="sp"></div>
    </div>

  </div><!-- /.studio-body -->

  <!-- ── Options panels ──────────────────────────────────────── -->
  <div class="opts">

    <!-- Selected clip info -->
    <div>
      <h3>Selected clip</h3>
      <span id="cn" style="color:var(--mu)">Click a clip to select it</span>
      <!-- Clip volume bar — rendered by Bars() in mix.js -->
      <div id="cvb" style="margin-top:10px"></div>
      <small id="cvl">Clip volume 100%</small>
    </div>

    <!-- Auto-duck controls -->
    <div>
      <h3>Background music level</h3>
      <label>
        <input type="checkbox" id="duck">
        Follow the voice (music dips while a voice clip speaks)
      </label>
      <!-- Depth bar — rendered by Bars() in mix.js -->
      <div id="db"></div>
      <small id="dl">Off: music plays at a steady level.</small>
    </div>

    <!-- Export -->
    <div>
      <h3>Export</h3>
      <div class="row" style="margin:0">
        <button class="amb" id="xw">Download WAV</button>
        <button id="xm">Download MP3</button>
      </div>
      <small id="xs">WAV is best quality. MP3 is smaller.</small>
    </div>

  </div><!-- /.opts -->

</main><!-- /.studio -->

<!-- ── All Volume — FL Studio Mixer (vertical strips) ─────────── -->
<div id="volume-dialog" class="volume-dialog" role="dialog"
     aria-labelledby="volume-title" aria-modal="true" hidden>

  <!-- 8 resize handles -->
  <div class="vm-resize" data-dir="n"></div>
  <div class="vm-resize" data-dir="ne"></div>
  <div class="vm-resize" data-dir="e"></div>
  <div class="vm-resize" data-dir="se"></div>
  <div class="vm-resize" data-dir="s"></div>
  <div class="vm-resize" data-dir="sw"></div>
  <div class="vm-resize" data-dir="w"></div>
  <div class="vm-resize" data-dir="nw"></div>

  <!-- Title bar -->
  <div class="vm-titlebar" id="vm-drag-handle">
    <span class="vm-title" id="volume-title">Mixer — All Channels</span>
    <div class="vm-winbtns">
      <button class="vm-wbtn vm-wbtn-min"  type="button" aria-label="Minimise" tabindex="-1">−</button>
      <button class="vm-wbtn vm-wbtn-max"  type="button" aria-label="Maximise" tabindex="-1">□</button>
      <button class="vm-wbtn vm-wbtn-close" type="button" id="close-vol" aria-label="Close">×</button>
    </div>
  </div>

  <!-- Channel strips row -->
  <div class="vm-strips-scroll">

    <!-- Master strip — always present -->
    <div class="vm-strip vm-strip-master" id="vm-master-strip">
      <div class="vm-strip-name-wrap">
        <span class="vm-strip-name">Master</span>
      </div>
      <div class="vm-strip-led-row">
        <span class="vm-led vm-led-green" id="master-led"></span>
      </div>
      <div class="vm-strip-knob-wrap">
        <div class="vm-knob" id="master-knob"><div class="vm-knob-dot"></div></div>
      </div>
      <div class="vm-strip-fader-area">
        <div class="vm-fader-slot">
          <div class="vm-fader-rail"></div>
          <div class="vm-fader-fill-v" id="master-fill"></div>
          <div class="vm-fader-cap"></div>
          <input class="vm-fader-input" id="master-volume" type="range"
                 min="0" max="200" step="1" value="100"
                 aria-label="Master volume"
                 style="writing-mode:vertical-lr;direction:rtl;-webkit-appearance:slider-vertical;appearance:auto;opacity:0;position:absolute;inset:0;width:100%;height:100%;cursor:ns-resize;z-index:4;margin:0;padding:0;">
        </div>
      </div>
      <div class="vm-strip-val">
        <output class="vm-val-num" id="master-value">100%</output>
      </div>
      <div class="vm-strip-bottom">
        <span class="vm-btn-icon" title="Master power">⏻</span>
      </div>
    </div>

    <!-- Per-clip strips injected by JS -->
    <div id="volume-list" class="vm-clip-strips-row"></div>

  </div><!-- /.vm-strips-scroll -->

</div><!-- /.volume-dialog -->

<!-- Backdrop -->
<div id="volume-backdrop" class="vm-backdrop" hidden></div>

<!-- ── Toast notification ───────────────────────────────────── -->
<div id="toast"></div>

<!-- ── Right-click context menu ─────────────────────────────── -->
<div id="clip-menu" class="clip-menu" role="menu" aria-label="Audio clip actions" hidden>
  <button type="button" role="menuitem" data-action="split">Trim here</button>
  <button type="button" role="menuitem" data-action="duplicate">Duplicate</button>
  <button type="button" role="menuitem" data-action="voice">Mark as voice</button>
  <button type="button" role="menuitem" data-action="delete">Delete</button>
</div>

<!-- site.js: header, nav active link, dirty-state guard -->
<script src="site.js"></script>
<!-- mix.js: all mixer logic -->
<script src="mix.js"></script>

</body>
</html>
